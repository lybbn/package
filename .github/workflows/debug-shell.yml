# 交互式调试 Shell：通过 tmate SSH 进入 GitHub Actions runner
# 触发方式：Actions 页面手动运行（workflow_dispatch）
name: macOS Debug Terminal

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-15-intel # macOS 15 (Intel x86_64，macos-13 已于 2025-12 退役)
    timeout-minutes: 60 # 防止空跑消耗 macOS 额度（macOS 计费是 Linux 的 10 倍）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true # 仅允许仓库所有者账号连接，安全
